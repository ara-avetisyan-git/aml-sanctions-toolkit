[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sanctions-toolkit"
version = "0.1.0"
description = "Small, auditable tools for UN sanctions list processing: load, diff and screen."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ara Avetisyan" }]
dependencies = ["rapidfuzz>=3.0", "defusedxml>=0.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
sanctions-toolkit = "sanctions_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
